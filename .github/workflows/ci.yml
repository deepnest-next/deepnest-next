# Build, unit-test and end-to-end-test the desktop app (workspace UI release + Rust backend).
# Needs the secret DEEPNEST_REPOS_TOKEN: a token with read access to the private
# deepnest-next repositories (rust-api-server, rust-nesting-lib, workspace-ui releases).
name: CI
on:
  push:
    branches: [main]
  pull_request:

# The repo token only checks out this repo; other repos use DEEPNEST_REPOS_TOKEN.
permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.DEEPNEST_REPOS_TOKEN }}
      GH_TOKEN: ${{ secrets.DEEPNEST_REPOS_TOKEN }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # Mirrors are sometimes very slow (~100 kB/s for the 25 MB webkit package); bound the
        # step anyway, the job default is 6 h.
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - name: Private git dependencies
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Workspace UI release
        run: bash scripts/fetch-ui.sh
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: End-to-end (WebDriver)
        run: bash scripts/e2e-docker.sh
