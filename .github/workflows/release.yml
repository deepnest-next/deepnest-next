name: Release Linux (rpm/deb/AppImage)

# Builds the Linux desktop bundles - including the Fedora/RHEL friendly `.rpm` -
# and attaches them to a GitHub Release.
#
# Triggers:
#   * pushing a tag matching `v*` (e.g. `v2.0.0`) -> creates/updates a draft
#     Release and uploads the bundles to it.
#   * manual `workflow_dispatch` -> just builds and uploads the bundles as
#     workflow artifacts (no Release is created because there is no tag).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Required so tauri-action can create the GitHub Release and upload assets.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 🛎️
        uses: actions/checkout@v4

      # System libraries required to build a Tauri v2 app on Linux, plus the
      # tooling needed to produce the `.rpm` bundle (`rpm`) and to patch the
      # AppImage/binary (`patchelf`).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf \
            file \
            rpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Rust dependency caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      # tauri-action runs the frontend build (via beforeBuildCommand) and the
      # Tauri bundler. `--bundles deb,rpm,appimage` makes the rpm output
      # explicit and independent of the `bundle.targets` value in tauri.conf.json.
      - name: Build Tauri bundles (rpm, deb, AppImage) 🔧
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only create a Release when triggered by a `v*` tag; on manual runs
          # these are empty so tauri-action just builds the bundles.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          tauriScript: bun
          args: --bundles deb,rpm,appimage

      # Always expose the produced bundles as downloadable workflow artifacts,
      # which is especially useful for `workflow_dispatch` runs without a tag.
      - name: Upload Linux bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
