name: Release
on: 
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Let cargo fetch the private engine git deps via the git CLI, which honors
  # the token-authenticated URL rewrite configured below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository 🛎️
        uses: actions/checkout@v7

      # The engine crates (rust-api-server, rust-nesting-lib, node-dxf2svg-processor)
      # live in private repos; DEEPNEST_REPOS_TOKEN grants cargo read access to them.
      # `shell: bash` keeps the token rewrite identical on the Windows/macOS runners.
      - name: Authenticate cargo for private engine repos
        shell: bash
        env:
          DEEPNEST_REPOS_TOKEN: ${{ secrets.DEEPNEST_REPOS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${DEEPNEST_REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install Tauri system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev file libxdo-dev libssl-dev libayatana-appindicator3-dev  librsvg2-dev
          
      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Configure Rust dependency caching
        uses: Swatinem/rust-cache@v2
          
      - name: Install frontend dependencies
        run: bun install
          
      - name: Build and publish Tauri application 🚀
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # the action automatically replaces __VERSION__ with the app version
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseDraft: true
          prerelease: false
          tauriScript: 'bun'